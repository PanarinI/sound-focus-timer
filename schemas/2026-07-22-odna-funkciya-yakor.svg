<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="-apple-system,'Segoe UI',sans-serif">
  <rect width="960" height="640" fill="#1a1614"/>
  <text x="30" y="42" fill="#e8e2da" font-size="21" font-weight="700">Якорь: одна функция — и её тело</text>
  <text x="30" y="64" fill="#8a827a" font-size="12.5">метод-проверка по заказу автора 07-22: «сведи нас к одной функции; редуцируй $-конкурентов; есть ли общее?»</text>

  <!-- Редукции конкурентов: два ряда -->
  <text x="30" y="108" fill="#e2a24a" font-size="14" font-weight="700">РЕДУКЦИЯ $-КОНКУРЕНТОВ — два ряда, каждый до главной функции</text>
  <rect x="30" y="122" width="430" height="120" rx="10" fill="#221c17" stroke="#3a3128"/>
  <text x="50" y="148" fill="#cfc8bf" font-size="13" font-weight="700">ряд ТАЙМЕРОВ → «рамка сессии» (время)</text>
  <g font-size="12" fill="#8a827a">
    <text x="50" y="170">Focus To-Do 500k → pomodoro-таймер (+обвес туду)</text>
    <text x="50" y="189">Otto 60k → pomodoro-таймер (+блокер)</text>
    <text x="50" y="208">Marinara† · pomofocus · Focus Keeper → таймер</text>
    <text x="50" y="227">Momentum 3M → красивая вкладка (таймер сбоку)</text>
  </g>
  <rect x="500" y="122" width="430" height="120" rx="10" fill="#221c17" stroke="#3a3128"/>
  <text x="520" y="148" fill="#cfc8bf" font-size="13" font-weight="700">ряд ЗВУКА → «среда сессии» (состояние)</text>
  <g font-size="12" fill="#8a827a">
    <text x="520" y="170">Brain.fm → музыка для состояния (таймер побочен)</text>
    <text x="520" y="189">Endel → саундскейп для состояния (фазы есть!)</text>
    <text x="520" y="208">Noisli · myNoise → шум-миксер (таймер = «выключи меня»)</text>
    <text x="520" y="227">BrainWave 37 → сессия-программа частот ($6.99, 2009)</text>
  </g>

  <!-- Пересечение -->
  <text x="480" y="279" fill="#e8e2da" font-size="14" font-weight="700" text-anchor="middle">ОБЩЕЕ МЕСТО, КОТОРОЕ НИКТО НЕ ЗАНЯЛ ЦЕЛИКОМ:</text>
  <rect x="180" y="292" width="600" height="56" rx="12" fill="none" stroke="#e2a24a" stroke-width="2"/>
  <text x="480" y="316" fill="#e2a24a" font-size="15" font-weight="700" text-anchor="middle">одна функция = СЕССИЯ ФОКУСА, где рамка и среда — ОДНО:</text>
  <text x="480" y="337" fill="#cfc8bf" font-size="13.5" text-anchor="middle">таймер, чьё время сделано из звука (звук ведёт: вход → плато → рассвет)</text>

  <!-- Тест вычитанием -->
  <g font-size="12.5">
    <text x="30" y="384" fill="#e2a24a" font-size="14" font-weight="700">ТЕСТ ВЫЧИТАНИЕМ (что ядро, что тело)</text>
    <text x="30" y="408" fill="#cfc8bf">− звук  → остаётся обычный таймер: продукт жив, отличия нет</text>
    <text x="30" y="428" fill="#cfc8bf">− таймер → остаётся шум-генератор: ПАРК (уже измерено 07-04)</text>
    <text x="30" y="448" fill="#7cb87c" font-weight="600">⇒ существительное = ТАЙМЕР · звук = его тело · мы — одна функция</text>
    <text x="30" y="470" fill="#8a827a">угли = след той же функции · язычок/PiP = каналы к ней ·</text>
    <text x="30" y="488" fill="#8a827a">специализация УЖЕ у́же соседей-комбайнов (туду/блокер/дашборд)</text>
  </g>

  <!-- Сцена образа -->
  <g font-size="12.5">
    <text x="500" y="384" fill="#e2a24a" font-size="14" font-weight="700">«ИДЕЯ ЗАТУШЕНА»? — раздвоить</text>
    <text x="500" y="408" fill="#7cb87c" font-weight="600">Идея (время-из-звука) НЕ затушена: её носитель — УХО,</text>
    <text x="500" y="426" fill="#7cb87c" font-weight="600">звук с тобой в любой вкладке при закрытой панели.</text>
    <text x="500" y="448" fill="#d97b6c" font-weight="600">Затушена — визуальная ПОЭТИКА (жар/угли):</text>
    <text x="500" y="466" fill="#8a827a">живёт на редкой поверхности. Это вопрос СЦЕНЫ, не концепта:</text>
    <text x="500" y="488" fill="#cfc8bf">A· уши-первые: панель=пульт, образ в звуке (ничего не строить)</text>
    <text x="500" y="506" fill="#cfc8bf">B· язычок=мини-жар на кромке (пересмотр вкуса 07-17)</text>
    <text x="500" y="524" fill="#cfc8bf">C· PiP «вынести жар» — опция для глаза (код есть)</text>
    <text x="500" y="542" fill="#5c554d">D· new-tab-красота — закрыта данными (20/мес · Flocus-ext 6k)</text>
  </g>

  <rect x="30" y="560" width="900" height="52" rx="10" fill="#221c17" stroke="#3a3128"/>
  <text x="50" y="582" fill="#e8e2da" font-size="13" font-weight="700">Деньги рядом платят ЗА ЗВУК, не за таймер-функцию:</text>
  <text x="50" y="601" fill="#8a827a" font-size="12">Momentum Plus $4.95/мес (soundscapes) · Flocus Plus $5–9/мес (звуки) · Focus To-Do/Otto IAP · BrainWave $6.99 · Endel/Brain.fm $60–120/год — наш премиум = глубина звука (tier уже в движке); мерится после 2k юзеров (веха 2), не чувством</text>
  <text x="700" y="630" fill="#5c554d" font-size="10.5">капсула sound-focus-timer · якорь для автора · 2026-07-22</text>
</svg>
