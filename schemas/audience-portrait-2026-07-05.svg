<svg viewBox="0 0 920 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', sans-serif">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7fb4ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7fb4ff" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="920" height="640" fill="#0e1116"/>

  <text x="40" y="44" fill="#dce3ee" font-size="23" font-weight="700">Портрет пользователя — три потребности, одно ядро</text>
  <text x="40" y="68" fill="#8b97a8" font-size="13">sound-focus-timer · 2026-07-05 · помодоро = ДВЕРЬ (канал), не аудитория</text>

  <!-- Круги Венна -->
  <circle cx="360" cy="290" r="175" fill="#7fb4ff" fill-opacity="0.10" stroke="#7fb4ff" stroke-opacity="0.7"/>
  <circle cx="560" cy="290" r="175" fill="#e8b25c" fill-opacity="0.10" stroke="#e8b25c" stroke-opacity="0.7"/>
  <circle cx="460" cy="430" r="175" fill="#c39bd3" fill-opacity="0.10" stroke="#c39bd3" stroke-opacity="0.7"/>

  <!-- подписи кругов -->
  <text x="250" y="200" fill="#7fb4ff" font-size="14" font-weight="600" text-anchor="middle">A · нужен ЗВУК</text>
  <text x="250" y="219" fill="#8b97a8" font-size="11.5" text-anchor="middle">чтобы фокусироваться</text>
  <text x="250" y="236" fill="#5c6a7d" font-size="11" text-anchor="middle">студенты · ADHD · опенспейс</text>

  <text x="672" y="200" fill="#e8b25c" font-size="14" font-weight="600" text-anchor="middle">B · резкие границы РАНЯТ</text>
  <text x="672" y="219" fill="#8b97a8" font-size="11.5" text-anchor="middle">фокус надо защищать</text>
  <text x="672" y="236" fill="#5c6a7d" font-size="11" text-anchor="middle">творческие · программисты</text>

  <text x="460" y="560" fill="#c39bd3" font-size="14" font-weight="600" text-anchor="middle">C · хочет КРАСИВЫЙ инструмент</text>
  <text x="460" y="579" fill="#5c6a7d" font-size="11" text-anchor="middle">эстеты · дизайн-чувствительные</text>

  <!-- ядро -->
  <ellipse cx="460" cy="335" rx="78" ry="70" fill="url(#core)"/>
  <text x="460" y="322" fill="#0e1116" font-size="13" font-weight="700" text-anchor="middle">ЯДРО</text>
  <text x="460" y="340" fill="#0e1116" font-size="10.5" text-anchor="middle" font-weight="600">звуко-первый фокусер,</text>
  <text x="460" y="354" fill="#0e1116" font-size="10.5" text-anchor="middle" font-weight="600">кому тяжело в тишине</text>
  <text x="460" y="368" fill="#0e1116" font-size="10.5" text-anchor="middle" font-weight="600">и режет звонок</text>

  <!-- ADHD маркер в центре -->
  <text x="460" y="405" fill="#5fce8f" font-size="12" font-weight="700" text-anchor="middle">◆ плацдарм: ADHD-взрослые</text>
  <text x="460" y="422" fill="#8b97a8" font-size="10" text-anchor="middle">меньше студентов, но платят и недо-обслужены</text>

  <!-- двери (каналы) -->
  <text x="40" y="500" fill="#8b97a8" font-size="12" letter-spacing="1">ДВЕРИ (как находят — SEO, не «кто они»)</text>
  <g font-size="11.5" fill="#c9d3e0">
    <rect x="40" y="512" width="180" height="26" rx="13" fill="#161b23" stroke="#2a3342"/><text x="130" y="529" text-anchor="middle">pomodoro / focus timer</text>
    <rect x="230" y="512" width="180" height="26" rx="13" fill="#161b23" stroke="#2a3342"/><text x="320" y="529" text-anchor="middle">aesthetic pomodoro timer</text>
    <rect x="40" y="546" width="180" height="26" rx="13" fill="#161b23" stroke="#2a3342"/><text x="130" y="563" text-anchor="middle">brown noise (90k · ADHD)</text>
    <rect x="230" y="546" width="180" height="26" rx="13" fill="#161b23" stroke="#2a3342"/><text x="320" y="563" text-anchor="middle">study music (33k)</text>
  </g>

  <!-- звук → механизм -->
  <text x="600" y="500" fill="#8b97a8" font-size="12" letter-spacing="1">ЗВУК → МЕХАНИЗМ (на кольцо)</text>
  <g font-size="11" fill="#c9d3e0">
    <text x="600" y="522"><tspan fill="#7fb4ff" font-weight="600">A ADHD/учёба:</tspan> шум ФУНКЦИОНАЛЕН</text>
    <text x="600" y="522" dy="0"/>
    <text x="600" y="540" fill="#5c6a7d">возбуждение+маскировка · бел/роз ✅ наука, brown 🔶 любовь</text>
    <text x="600" y="560"><tspan fill="#e8b25c" font-weight="600">B защита:</tspan> мягкие ГРАНИЦЫ (драматургия сессии)</text>
    <text x="600" y="580"><tspan fill="#c39bd3" font-weight="600">C эстет:</tspan> ЖИВОЙ генеративный звук + визуал = вайб</text>
  </g>

  <text x="40" y="624" fill="#3d4757" font-size="10.5">Схема-суть для автора · поворот к шуму (не дрон) механизм-верен для ADHD-центра · спорный тезис: студенты = большой, но забитый и неплатящий круг → плацдарм в ADHD-взрослых</text>
</svg>
