<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="-apple-system, 'Segoe UI', Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b9863f"/>
    </marker>
    <marker id="arDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b5f50"/>
    </marker>
    <radialGradient id="starGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fff2d6"/><stop offset="45%" stop-color="#f2a955"/><stop offset="100%" stop-color="#d6784600"/>
    </radialGradient>
    <g id="rs"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.4L12 17.4l-5.8 3 1.1-6.4L2.6 9.4l6.5-.9z"/></g>
  </defs>

  <rect x="0" y="0" width="900" height="430" rx="16" fill="#0a0d1e"/>

  <text x="40" y="44" fill="#c9a86a" font-size="19" font-weight="600">When the timer asks for a rating</text>
  <text x="40" y="66" fill="#6b5f50" font-size="12.5">A quiet door from the first launch, the card from the 3rd flight. Dismissed comes back; an answer never does.</text>

  <!-- ── ТРЕК РЕЙСОВ ─────────────────────────────────────────────── -->
  <line x1="46" y1="330" x2="854" y2="330" stroke="#33281c" stroke-width="2"/>
  <text x="46" y="414" fill="#5c5145" font-size="11.5">A flight counts only if it carried you ≥ 1 min — a poke at the star to hear the sound does not.</text>

  <g fill="#9a7c4f" font-size="12" text-anchor="middle">
    <circle cx="120" cy="330" r="7" fill="#3f3324"/><text x="120" y="358" fill="#5c5145">flight 1</text>
    <circle cx="220" cy="330" r="7" fill="#3f3324"/><text x="220" y="358" fill="#5c5145">flight 2</text>
    <circle cx="360" cy="330" r="9" fill="#b9863f"/><text x="360" y="358">flight 3</text>
    <circle cx="640" cy="330" r="9" fill="#b9863f"/><text x="640" y="358">flight 4</text>
    <circle cx="790" cy="330" r="7" fill="#3f3324"/><text x="790" y="358" fill="#5c5145">flight 5</text>
  </g>
  <path d="M104 372 H236" stroke="#33281c" stroke-width="1.5"/>
  <text x="170" y="389" fill="#5c5145" font-size="11.5" text-anchor="middle">no card yet — learning the interface</text>

  <!-- ── ТИХАЯ ДВЕРЬ: плашка в углу дока, с первого ОТКРЫТИЯ панели ── -->
  <path d="M62 322 V 292" stroke="#5c5145" stroke-width="1.4" marker-end="url(#arDim)"/>
  <text x="40" y="240" fill="#8a7157" font-size="11.5">from the first launch — a quiet row</text>
  <text x="40" y="256" fill="#5c5145" font-size="11.5">in the corner of the dock, always there</text>
  <rect x="40" y="266" width="176" height="26" rx="7" fill="#0f1226" stroke="#2e2517"/>
  <text x="52" y="283" fill="#6b5f50" font-size="9.5">Rate us</text>
  <g fill="#46351f" transform="translate(126 270) scale(0.5)">
    <use href="#rs" x="0"/><use href="#rs" x="30"/><use href="#rs" x="60"/><use href="#rs" x="90"/><use href="#rs" x="120"/>
  </g>

  <!-- ── КАРТОЧКА ПОВЕРХ ЗВЕЗДЫ ──────────────────────────────────── -->
  <path d="M360 318 V250" stroke="#b9863f" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="372" y="286" fill="#9a7c4f" font-size="11.5">at arrival, in stillness</text>

  <circle cx="360" cy="176" r="34" fill="url(#starGlow)" opacity=".5"/>
  <rect x="262" y="118" width="196" height="116" rx="14" fill="#120d08" stroke="#3a2d1f"/>
  <text x="360" y="146" fill="#c9a86a" font-size="12.5" text-anchor="middle">How was the flight?</text>
  <g fill="#6b5344" transform="translate(280 158) scale(0.85)">
    <use href="#rs" x="0"/><use href="#rs" x="30"/><use href="#rs" x="60"/><use href="#rs" x="90"/><use href="#rs" x="120"/>
  </g>
  <text x="360" y="214" fill="#5c5145" font-size="11" text-anchor="middle">Not now</text>
  <text x="360" y="100" fill="#8a7157" font-size="11.5" text-anchor="middle">over the star, where the eye already is</text>

  <!-- ── ЧТО КАРТОЧКА ДЕЛАЕТ С ПАНЕЛЬЮ ───────────────────────────── -->
  <g font-size="11.5">
    <path d="M246 158 H60" stroke="#4a3826" stroke-width="1.4" stroke-dasharray="3 4"/>
    <text x="40" y="140" fill="#9a7c4f">the sky stops launching</text>
    <text x="40" y="180" fill="#5c5145">volume · length · settings</text>
    <text x="40" y="196" fill="#5c5145">stay in your hands</text>
  </g>

  <!-- ── ВЫХОД 1: СБРОС → ВОЗВРАТ ────────────────────────────────── -->
  <path d="M462 210 C 540 240, 570 272, 626 314" stroke="#6b5f50" stroke-width="1.6" fill="none" marker-end="url(#arDim)"/>
  <text x="668" y="256" fill="#8a7157" font-size="11.5">click aside · Not now</text>
  <text x="668" y="274" fill="#5c5145" font-size="11.5">→ back after the next flight</text>

  <!-- ── ВЫХОД 2: ОТВЕТ → НАВСЕГДА ───────────────────────────────── -->
  <path d="M458 140 H 552" stroke="#b9863f" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="466" y="130" fill="#c9a86a" font-size="11.5">a star tapped</text>

  <rect x="566" y="82" width="296" height="116" rx="12" fill="#0f1226" stroke="#4a3826"/>
  <text x="586" y="108" fill="#c9a86a" font-size="12.5" font-weight="600">asked once, never again</text>
  <g font-size="12">
    <g fill="#e8b25c" transform="translate(586 122) scale(0.6)">
      <use href="#rs" x="0"/><use href="#rs" x="26"/><use href="#rs" x="52"/><use href="#rs" x="78"/>
    </g>
    <text x="656" y="136" fill="#9a7c4f">→ store reviews</text>
    <g fill="#6b5344" transform="translate(586 148) scale(0.6)">
      <use href="#rs" x="0"/><use href="#rs" x="26"/>
    </g>
    <text x="656" y="162" fill="#9a7c4f">→ our own form, not the store</text>
  </g>
  <text x="586" y="186" fill="#5c5145" font-size="10.5">we learn that it was tapped — not that a review was left</text>
</svg>
