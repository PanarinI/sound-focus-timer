<svg xmlns="http://www.w3.org/2000/svg" width="680" height="322" viewBox="0 0 680 322" role="img" font-family="-apple-system, 'Segoe UI', sans-serif">
<title>Логика интерфейса sound-focus-timer — один жар, четыре облика</title>
<desc>Лестница присутствия: иконка в тулбаре, язычок-отблеск на краю страницы, дом в боковой панели Chrome со всем богатым, вынос в PiP. Отблеск и дом — один жар, не показываются одновременно. Портреты пользователей привязаны к обликам.</desc>
<rect width="680" height="322" fill="#14100b"/>
<style>
  .th{fill:#e8d5b5;font-size:14px;font-weight:500}
  .t{fill:#c9bdae;font-size:14px}
  .ts{fill:#8f8272;font-size:12px}
  .amber{fill:#2a1f12;stroke:#b9863f;stroke-width:1.5}
  .gray{fill:#1e1a15;stroke:#5c5145;stroke-width:1.5}
  .lbl-a{fill:#f0d8b0;font-size:14px;font-weight:500}
  .lbl-g{fill:#cfc4b4;font-size:14px;font-weight:500}
  .sub{fill:#9a8b74;font-size:12px}
  .arr{stroke:#8a7256;stroke-width:1.5;fill:none}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8a7256" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="40" y="32">Один жар — четыре облика</text>
<text class="ts" x="40" y="50">янтарь = присутствие жара · серое = каркас</text>

<rect class="gray" x="40" y="64" width="132" height="58" rx="8"/>
<text class="lbl-g" x="106" y="88" text-anchor="middle">Иконка</text>
<text class="sub" x="106" y="106" text-anchor="middle">тулбар · 0 прав</text>

<rect class="amber" x="192" y="64" width="132" height="58" rx="8"/>
<text class="lbl-a" x="258" y="88" text-anchor="middle">Язычок-отблеск</text>
<text class="sub" x="258" y="106" text-anchor="middle">свет на краю</text>

<rect class="amber" x="344" y="64" width="132" height="58" rx="8"/>
<text class="lbl-a" x="410" y="88" text-anchor="middle">Дом · панель</text>
<text class="sub" x="410" y="106" text-anchor="middle">очаг · всё богатое</text>

<rect class="amber" x="496" y="64" width="132" height="58" rx="8"/>
<text class="lbl-a" x="562" y="88" text-anchor="middle">PiP-вынос</text>
<text class="sub" x="562" y="106" text-anchor="middle">поверх ОС</text>

<line class="arr" x1="326" y1="93" x2="342" y2="93" marker-end="url(#ar)" marker-start="url(#ar)"/>
<line class="arr" x1="478" y1="93" x2="494" y2="93" marker-end="url(#ar)"/>

<text class="ts" x="40" y="146">Отблеск несёт: присутствие + фазу сессии — свет крепнет, без цифр. Клик размыкает дом.</text>
<text class="ts" x="40" y="166">Дом несёт: жар · кольцо (дуга + огонёк-ручка) · громкость · «завершить» · угли · настройки.</text>

<rect class="amber" x="40" y="182" width="600" height="50" rx="8"/>
<text class="lbl-a" x="58" y="204">Не два шара — один жар</text>
<text class="sub" x="58" y="222">дом открыт → отблеск втянут внутрь · дом закрыт → жар свернулся на край · никогда оба сразу</text>

<text class="th" x="40" y="258">Кому какой облик</text>
<text class="t" x="40" y="278">Ре — отблеск + дом (жар не исчезает) · Ая, Ми — дом (компаньон рядом)</text>
<text class="t" x="40" y="296">Лу — отблеск (находит сразу) · Тео — PiP (работает вне браузера)</text>
</svg>
