<svg viewBox="0 0 780 590" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', sans-serif">
  <title>Тепло очага — слой накопления угольков</title>
  <desc>Решение 2026-07-23: прожитое не показывается дискретно — оно чувствуется. Три полки времени: сегодня (угли), вчера (зола), всё прожитое (тепло). Монотонность = вина невозможна.</desc>
  <rect width="780" height="590" fill="#120c07"/>

  <!-- Шапка -->
  <text x="390" y="40" text-anchor="middle" fill="#e8b25c" font-size="21" font-weight="600">УГОЛЬКИ: слой накопления = ТЕПЛО ОЧАГА</text>
  <text x="390" y="62" text-anchor="middle" fill="#8a7660" font-size="12">решение автора 2026-07-23 · прожитое не показывается — чувствуется</text>

  <!-- Три полки времени -->
  <g>
    <rect x="40" y="90" width="220" height="150" rx="10" fill="#1c1208" stroke="#5a4530" stroke-width="1.2"/>
    <text x="150" y="115" text-anchor="middle" fill="#e8b25c" font-size="14" font-weight="600">СЕГОДНЯ</text>
    <text x="150" y="133" text-anchor="middle" fill="#9a7c4f" font-size="11">угли-слепки сессий</text>
    <!-- ряд углей, гряда -->
    <g fill="#a35c28" opacity="0.9">
      <circle cx="85" cy="165" r="5"/><circle cx="101" cy="165" r="7"/><circle cx="117" cy="165" r="4"/>
      <circle cx="133" cy="165" r="8"/><circle cx="149" cy="165" r="6"/><circle cx="165" cy="165" r="7"/>
      <circle cx="181" cy="165" r="4"/><circle cx="197" cy="165" r="8"/><circle cx="213" cy="165" r="6"/>
    </g>
    <text x="150" y="198" text-anchor="middle" fill="#7a6a55" font-size="10.5">диаметр = длительность · искорка честна</text>
    <text x="150" y="215" text-anchor="middle" fill="#7a6a55" font-size="10.5">10+ сессий → ряд теснится грядой</text>
    <text x="150" y="230" text-anchor="middle" fill="#7a6a55" font-size="10.5">(чинено 07-23: раньше слипались у краёв)</text>
  </g>

  <g>
    <rect x="280" y="90" width="220" height="150" rx="10" fill="#1c1208" stroke="#5a4530" stroke-width="1.2"/>
    <text x="390" y="115" text-anchor="middle" fill="#e8b25c" font-size="14" font-weight="600">ВЧЕРА</text>
    <text x="390" y="133" text-anchor="middle" fill="#9a7c4f" font-size="11">зола — один след</text>
    <line x1="320" y1="168" x2="460" y2="168" stroke="#4a3826" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <text x="390" y="198" text-anchor="middle" fill="#7a6a55" font-size="10.5">длина = минуты вчерашнего дня</text>
    <text x="390" y="215" text-anchor="middle" fill="#7a6a55" font-size="10.5">наутро угли прогорают в полоску</text>
  </g>

  <g>
    <rect x="520" y="90" width="220" height="150" rx="10" fill="#241708" stroke="#b9702a" stroke-width="1.5"/>
    <text x="630" y="115" text-anchor="middle" fill="#e8b25c" font-size="14" font-weight="600">ВСЁ ПРОЖИТОЕ</text>
    <text x="630" y="133" text-anchor="middle" fill="#9a7c4f" font-size="11">тепло — три тихих проявления</text>
    <text x="630" y="158" text-anchor="middle" fill="#c9a06a" font-size="11">осадок золы — ниже, шире, тише</text>
    <line x1="545" y1="170" x2="715" y2="170" stroke="#3a2c1d" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <text x="630" y="193" text-anchor="middle" fill="#c9a06a" font-size="11">тон комнаты теплеет</text>
    <text x="630" y="211" text-anchor="middle" fill="#c9a06a" font-size="11">камень-орб в покое чуть ярче</text>
    <text x="630" y="229" text-anchor="middle" fill="#7a6a55" font-size="10.5">без цифр · без клеток · без списков</text>
  </g>

  <!-- стрелки прогорания -->
  <g stroke="#6f553a" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M262 165 L 278 165" marker-end="url(#arr)"/>
    <path d="M502 165 L 518 165" marker-end="url(#arr)"/>
  </g>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#6f553a" stroke-width="1.3"/>
    </marker>
  </defs>
  <text x="270" y="152" text-anchor="middle" fill="#6f553a" font-size="10">прогорает</text>
  <text x="510" y="152" text-anchor="middle" fill="#6f553a" font-size="10">оседает</text>

  <!-- Инвариант -->
  <rect x="40" y="262" width="700" height="76" rx="10" fill="#1a1208" stroke="#e8b25c" stroke-width="1.3"/>
  <text x="390" y="288" text-anchor="middle" fill="#e8b25c" font-size="14" font-weight="600">ИНВАРИАНТ: тепло МОНОТОННО — только растёт, не остывает</text>
  <text x="390" y="309" text-anchor="middle" fill="#c9bdae" font-size="12">пропуск дней ничего не отнимает → вина невозможна конструктивно</text>
  <text x="390" y="327" text-anchor="middle" fill="#8a7660" font-size="11">(камни очага держат тепло; whiteboard-ритуал: накопление ощущается, цифр нет — цифры только за ховером)</text>

  <!-- Почему: данные разведки -->
  <text x="60" y="372" fill="#b9863f" font-size="13" font-weight="600">ПОЧЕМУ ТАК — разведка 16 конкурентов (07-23):</text>
  <g font-size="11.5" fill="#a08a70">
    <text x="72" y="396">4 ответа индустрии на «куда девается много»: перелистывание (Forest) · агрегаты-графики (Pomofocus,</text>
    <text x="72" y="413">Focus To-Do) · один счётчик (Kitty) · полка-коллекция без времени (аквариумы, Focumon)</text>
    <text x="72" y="436">Метафору огня не делает НИКТО — «остывающий след» свободен → наш клин продолжается и здесь</text>
    <text x="72" y="459">Otto (вспомнил автор) = связь-существо (стадии дружбы) — нам закрыто онтологией «жар НЕ персонаж» (07-16)</text>
    <text x="72" y="482">Вина — три школы: руина (Forest) · streak-обнуление (Flocus) · отказ (Otto, Tide) — мы в третьей, конструктивно</text>
  </g>

  <!-- Механика внизу -->
  <rect x="40" y="504" width="700" height="60" rx="10" fill="#161009" stroke="#3a2d1f" stroke-width="1"/>
  <text x="60" y="527" fill="#9a7c4f" font-size="11.5" font-weight="600">МЕХАНИКА (hearth.js, b=13):</text>
  <text x="60" y="546" fill="#7a6a55" font-size="11">тепло = 1 − exp(−прожитые_минуты / 3000): 10 ч → 0.18 · 50 ч → 0.63 · 100 ч → 0.86 — заметно через недели, не дни;</text>
  <text x="60" y="560" fill="#7a6a55" font-size="11">данные уже копились с рождения углей (localStorage, ничего не стирается) — тепло честно и у старых очагов</text>
</svg>
