<svg viewBox="0 0 940 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="daycycle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b3a67"/>
      <stop offset="0.25" stop-color="#e8b25c"/>
      <stop offset="0.5" stop-color="#f5e6c4"/>
      <stop offset="0.75" stop-color="#c98a5b"/>
      <stop offset="1" stop-color="#2b3a67"/>
    </linearGradient>
    <linearGradient id="arcfill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb4ff" stop-opacity="0.10"/>
      <stop offset="0.18" stop-color="#7fb4ff" stop-opacity="0.45"/>
      <stop offset="0.8" stop-color="#7fb4ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe9b0" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="940" height="600" fill="#0e1116"/>

  <!-- Заголовок -->
  <text x="40" y="46" fill="#dce3ee" font-size="24" font-weight="700">Sound Focus Timer — суть организма</text>
  <text x="40" y="70" fill="#8b97a8" font-size="13">рождён 2026-07-04 из разведки app-studio · «время, сделанное из звука»</text>

  <!-- Палитра времени суток -->
  <text x="40" y="106" fill="#8b97a8" font-size="12" letter-spacing="1">ПАЛИТРА ЗНАЕТ ВРЕМЯ СУТОК</text>
  <rect x="40" y="114" width="860" height="10" rx="5" fill="url(#daycycle)"/>
  <text x="40" y="140" fill="#5c6a7d" font-size="11">ночь — глуше</text>
  <text x="450" y="140" fill="#5c6a7d" font-size="11" text-anchor="middle">день — светлее</text>
  <text x="900" y="140" fill="#5c6a7d" font-size="11" text-anchor="end">ночь</text>

  <!-- Драматургия сессии: звуковая арка -->
  <text x="40" y="184" fill="#8b97a8" font-size="12" letter-spacing="1">ДРАМАТУРГИЯ СЕССИИ — ЗВУК ВМЕСТО ЦИФЕРБЛАТА</text>

  <!-- слои волны -->
  <path d="M 60 320 C 140 318 160 306 220 296 C 420 268 560 268 700 282 C 780 290 830 270 880 240"
        fill="none" stroke="#7fb4ff" stroke-width="2.5" opacity="0.9"/>
  <path d="M 60 326 C 150 326 180 318 240 310 C 430 288 560 288 690 300 C 775 308 830 288 878 262"
        fill="none" stroke="#7fb4ff" stroke-width="1.6" opacity="0.55"/>
  <path d="M 60 332 C 160 334 200 330 260 324 C 440 308 555 308 680 318 C 770 326 828 306 876 284"
        fill="none" stroke="#7fb4ff" stroke-width="1" opacity="0.3"/>
  <path d="M 60 320 C 140 318 160 306 220 296 C 420 268 560 268 700 282 C 780 290 830 270 880 240
           L 880 340 L 60 340 Z" fill="url(#arcfill)" opacity="0.35"/>

  <!-- фазы -->
  <line x1="220" y1="205" x2="220" y2="352" stroke="#2a3342" stroke-dasharray="3 4"/>
  <line x1="700" y1="205" x2="700" y2="352" stroke="#2a3342" stroke-dasharray="3 4"/>

  <text x="130" y="222" fill="#dce3ee" font-size="14" font-weight="600" text-anchor="middle">вход</text>
  <text x="130" y="240" fill="#8b97a8" font-size="11.5" text-anchor="middle">«минута до»: собирание,</text>
  <text x="130" y="255" fill="#8b97a8" font-size="11.5" text-anchor="middle">спуск в концентрацию</text>

  <text x="460" y="222" fill="#dce3ee" font-size="14" font-weight="600" text-anchor="middle">плато</text>
  <text x="460" y="240" fill="#8b97a8" font-size="11.5" text-anchor="middle">звук охраняет поток стабильностью —</text>
  <text x="460" y="255" fill="#8b97a8" font-size="11.5" text-anchor="middle">в потоке меняется МЕНЬШЕ, не больше</text>

  <text x="800" y="222" fill="#ffe9b0" font-size="14" font-weight="600" text-anchor="middle">рассвет</text>
  <text x="800" y="240" fill="#8b97a8" font-size="11.5" text-anchor="middle">не будильник: звук</text>
  <text x="800" y="255" fill="#8b97a8" font-size="11.5" text-anchor="middle">раскрывается и светлеет</text>

  <!-- Слои MVP / v2 -->
  <rect x="40" y="380" width="420" height="92" rx="12" fill="#161b23" stroke="#5fce8f"/>
  <text x="60" y="406" fill="#5fce8f" font-size="13" font-weight="700">MVP — веха 1: публикация в CWS</text>
  <text x="60" y="428" fill="#c9d3e0" font-size="12">сессия-драматургия + палитра времени суток</text>
  <text x="60" y="446" fill="#c9d3e0" font-size="12">всё на устройстве · $0 инфры · без слежки</text>
  <text x="60" y="464" fill="#5c6a7d" font-size="11">имя — без «Pomodoro» (марка Чирилло)</text>

  <rect x="480" y="380" width="420" height="92" rx="12" fill="#161b23" stroke="#c39bd3" stroke-dasharray="6 4"/>
  <text x="500" y="406" fill="#c39bd3" font-size="13" font-weight="700">v2 — после линьки</text>
  <text x="500" y="428" fill="#c9d3e0" font-size="12">«зов» из дрейфа: тихий мотив — «лампа в соседней</text>
  <text x="500" y="446" fill="#c9d3e0" font-size="12">комнате» (юзер сам размечает болота) · «клавиши-тени»</text>
  <text x="500" y="464" fill="#5c6a7d" font-size="11">шина событий движка закладывается уже в MVP</text>

  <!-- Вехи -->
  <text x="40" y="516" fill="#8b97a8" font-size="12" letter-spacing="1">ПУТЬ ОРГАНИЗМА</text>
  <circle cx="60" cy="545" r="7" fill="#5fce8f"/>
  <text x="80" y="550" fill="#dce3ee" font-size="12.5">веха 1 · опубликован в CWS</text>
  <line x1="270" y1="545" x2="420" y2="545" stroke="#2a3342" stroke-width="2"/>
  <text x="345" y="536" fill="#5c6a7d" font-size="10.5" text-anchor="middle">метаморфоза: линька в продукт</text>
  <circle cx="435" cy="545" r="7" fill="none" stroke="#e8b25c" stroke-width="2"/>
  <text x="455" y="550" fill="#dce3ee" font-size="12.5">веха 2 · 2000 юзеров — порог монетизации</text>

  <!-- Девиз -->
  <text x="900" y="550" fill="#7fb4ff" font-size="13" font-style="italic" text-anchor="end">«мягкий фокус: не запираем — зовём»</text>

  <!-- Плашка-подпись -->
  <text x="40" y="585" fill="#3d4757" font-size="10.5">схема-суть для автора · sound-focus-timer/schemas/ · мотив: честный коммерческий запуск по методике · аудитория: те, кому фокус надо защищать, а не создавать</text>
</svg>
