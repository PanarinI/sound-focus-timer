<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="zvezda" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ffb055" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ff9a2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vinetka" cx="50%" cy="42%" r="72%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <filter id="zerno" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g"><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    </filter>
    <linearGradient id="duga" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb055" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffb055" stop-opacity=".25"/>
    </linearGradient>
  </defs>

  <rect width="1240" height="780" fill="#141210"/>
  <text x="230" y="44" fill="#e8ded2" font-size="20" font-weight="600">Макет панели — аналоговый космос</text>
  <text x="230" y="66" fill="#8a8178" font-size="13">26.09.2026 · тёмное поле · тёплый янтарь · зерно как материал · шкала-дайл вместо палки · цвет интерфейса = цвет звука</text>

  <!-- ЛЕВАЯ ПАНЕЛЬ: ПОКОЙ -->
  <g transform="translate(300,100)">
    <rect width="320" height="600" rx="20" fill="#0d0c0b" stroke="#272220"/>
    <rect width="320" height="600" rx="20" filter="url(#zerno)" opacity=".5"/>
    <rect width="320" height="600" rx="20" fill="url(#vinetka)"/>
    <text x="160" y="-14" fill="#8a8178" font-size="12" text-anchor="middle">ПОКОЙ · звук не идёт</text>

    <!-- цвета шума = температуры света -->
    <g transform="translate(232,34)">
      <circle cx="0" cy="0" r="9" fill="#c98a4b"/><circle cx="0" cy="0" r="13" fill="none" stroke="#ffb055" stroke-opacity=".7"/>
      <circle cx="26" cy="0" r="9" fill="#b98a95"/>
      <circle cx="52" cy="0" r="9" fill="#d9d6d0"/>
    </g>
    <text x="24" y="39" fill="#6f665d" font-size="11">цвет шума</text>

    <!-- звезда в покое -->
    <circle cx="160" cy="190" r="86" fill="url(#zvezda)" opacity=".5"/>
    <circle cx="160" cy="190" r="15" fill="#ffd9a0"/>
    <g fill="#efe3d2" opacity=".5">
      <circle cx="70" cy="120" r="1.4"/><circle cx="250" cy="140" r="1.2"/><circle cx="105" cy="255" r="1.1"/>
      <circle cx="220" cy="248" r="1.5"/><circle cx="60" cy="210" r="1"/><circle cx="265" cy="205" r="1.2"/>
    </g>

    <!-- дайл времени -->
    <g transform="translate(160,352)">
      <path d="M -112 0 A 112 112 0 0 1 112 0" fill="none" stroke="#2b2724" stroke-width="7" stroke-linecap="round"/>
      <path d="M -112 0 A 112 112 0 0 1 -6 -111" fill="none" stroke="url(#duga)" stroke-width="7" stroke-linecap="round"/>
      <g stroke="#4a423b" stroke-width="2">
        <line x1="-112" y1="0" x2="-101" y2="0"/><line x1="-92" y1="-64" x2="-83" y2="-58"/>
        <line x1="-40" y1="-105" x2="-36" y2="-95"/><line x1="18" y1="-110" x2="16" y2="-100"/>
        <line x1="76" y1="-82" x2="69" y2="-75"/><line x1="112" y1="0" x2="101" y2="0"/>
      </g>
      <g fill="#6f665d" font-size="10" text-anchor="middle">
        <text x="-118" y="16">5</text><text x="-99" y="-70">15</text><text x="-44" y="-112">25</text>
        <text x="22" y="-117">45</text><text x="86" y="-88">90</text><text x="119" y="16">∞</text>
      </g>
      <line x1="0" y1="0" x2="-6" y2="-98" stroke="#ffd9a0" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="4" fill="#ffd9a0"/>
      <text x="0" y="-36" fill="#efe3d2" font-size="26" text-anchor="middle" font-weight="600">25′</text>
    </g>

    <!-- кнопки -->
    <g transform="translate(160,404)">
      <rect x="-86" y="0" width="140" height="42" rx="21" fill="#ffb055"/>
      <text x="-16" y="27" fill="#241a10" font-size="15" text-anchor="middle" font-weight="600">▶  Start</text>
      <circle cx="82" cy="21" r="21" fill="none" stroke="#4a423b"/>
      <text x="82" y="28" fill="#c9bfb2" font-size="17" text-anchor="middle">∞</text>
    </g>

    <!-- три ручки-дуги -->
    <g transform="translate(0,500)">
      <g transform="translate(60,0)">
        <path d="M -24 10 A 26 26 0 1 1 24 10" fill="none" stroke="#2b2724" stroke-width="5" stroke-linecap="round"/>
        <path d="M -24 10 A 26 26 0 0 1 4 -25" fill="none" stroke="#ffb055" stroke-width="5" stroke-linecap="round"/>
        <text x="0" y="8" fill="#c9bfb2" font-size="12" text-anchor="middle">громкость</text>
        <text x="0" y="34" fill="#6f665d" font-size="10" text-anchor="middle">60 % — предел</text>
      </g>
      <g transform="translate(160,0)">
        <path d="M -24 10 A 26 26 0 1 1 24 10" fill="none" stroke="#2b2724" stroke-width="5" stroke-linecap="round"/>
        <path d="M -24 10 A 26 26 0 0 1 24 10" fill="none" stroke="#ffb055" stroke-width="5" stroke-linecap="round" opacity=".75"/>
        <text x="0" y="8" fill="#c9bfb2" font-size="12" text-anchor="middle">маскировка</text>
        <text x="0" y="34" fill="#6f665d" font-size="10" text-anchor="middle">закрыть речь</text>
      </g>
      <g transform="translate(260,0)">
        <path d="M -24 10 A 26 26 0 1 1 24 10" fill="none" stroke="#2b2724" stroke-width="5" stroke-linecap="round"/>
        <path d="M -24 10 A 26 26 0 0 1 -12 -22" fill="none" stroke="#ffb055" stroke-width="5" stroke-linecap="round"/>
        <text x="0" y="8" fill="#c9bfb2" font-size="12" text-anchor="middle">стимуляция</text>
        <text x="0" y="34" fill="#6f665d" font-size="10" text-anchor="middle">сколько шума</text>
      </g>
    </g>

    <line x1="24" y1="556" x2="296" y2="556" stroke="#272220"/>
    <text x="24" y="580" fill="#8a8178" font-size="12">Пресеты: опенспейс · общежитие · кафе · чтение</text>
    <text x="296" y="580" fill="#6f665d" font-size="12" text-anchor="end">⌄</text>
  </g>

  <!-- ПРАВАЯ ПАНЕЛЬ: РЕЙС -->
  <g transform="translate(700,100)">
    <rect width="320" height="600" rx="20" fill="#0d0c0b" stroke="#272220"/>
    <rect width="320" height="600" rx="20" filter="url(#zerno)" opacity=".5"/>
    <rect width="320" height="600" rx="20" fill="url(#vinetka)"/>
    <text x="160" y="-14" fill="#8a8178" font-size="12" text-anchor="middle">РЕЙС · звук идёт, панель можно закрыть</text>

    <g transform="translate(232,34)">
      <circle cx="0" cy="0" r="9" fill="#c98a4b"/><circle cx="0" cy="0" r="13" fill="none" stroke="#ffb055" stroke-opacity=".7"/>
      <circle cx="26" cy="0" r="9" fill="#b98a95"/>
      <circle cx="52" cy="0" r="9" fill="#d9d6d0"/>
    </g>

    <circle cx="160" cy="190" r="118" fill="url(#zvezda)" opacity=".85"/>
    <circle cx="160" cy="190" r="26" fill="#ffe6bd"/>
    <g stroke="#efe3d2" stroke-opacity=".45" stroke-linecap="round">
      <line x1="58" y1="96" x2="74" y2="116" stroke-width="1.4"/>
      <line x1="262" y1="110" x2="246" y2="128" stroke-width="1.4"/>
      <line x1="46" y1="256" x2="70" y2="238" stroke-width="1.6"/>
      <line x1="276" y1="248" x2="252" y2="232" stroke-width="1.6"/>
      <line x1="150" y1="330" x2="156" y2="300" stroke-width="1.2"/>
    </g>

    <g transform="translate(160,352)">
      <path d="M -112 0 A 112 112 0 0 1 112 0" fill="none" stroke="#2b2724" stroke-width="7" stroke-linecap="round"/>
      <path d="M -112 0 A 112 112 0 0 1 -40 -105" fill="none" stroke="url(#duga)" stroke-width="7" stroke-linecap="round"/>
      <text x="0" y="-36" fill="#efe3d2" font-size="26" text-anchor="middle" font-weight="600">12′ 40″</text>
      <text x="0" y="-12" fill="#6f665d" font-size="11" text-anchor="middle">осталось до прибытия</text>
    </g>

    <g transform="translate(160,404)">
      <rect x="-86" y="0" width="140" height="42" rx="21" fill="none" stroke="#5a4c3c"/>
      <text x="-16" y="27" fill="#e8ded2" font-size="15" text-anchor="middle">☀  Finish</text>
      <circle cx="82" cy="21" r="21" fill="none" stroke="#4a423b"/>
      <text x="82" y="28" fill="#6f665d" font-size="17" text-anchor="middle">∞</text>
    </g>

    <g transform="translate(0,500)" opacity=".9">
      <g transform="translate(60,0)">
        <path d="M -24 10 A 26 26 0 1 1 24 10" fill="none" stroke="#2b2724" stroke-width="5" stroke-linecap="round"/>
        <path d="M -24 10 A 26 26 0 0 1 4 -25" fill="none" stroke="#ffb055" stroke-width="5" stroke-linecap="round"/>
        <text x="0" y="8" fill="#c9bfb2" font-size="12" text-anchor="middle">громкость</text>
      </g>
      <g transform="translate(160,0)">
        <path d="M -24 10 A 26 26 0 1 1 24 10" fill="none" stroke="#2b2724" stroke-width="5" stroke-linecap="round"/>
        <path d="M -24 10 A 26 26 0 0 1 24 10" fill="none" stroke="#ffb055" stroke-width="5" stroke-linecap="round" opacity=".75"/>
        <text x="0" y="8" fill="#c9bfb2" font-size="12" text-anchor="middle">маскировка</text>
      </g>
      <g transform="translate(260,0)">
        <path d="M -24 10 A 26 26 0 1 1 24 10" fill="none" stroke="#2b2724" stroke-width="5" stroke-linecap="round"/>
        <path d="M -24 10 A 26 26 0 0 1 -12 -22" fill="none" stroke="#ffb055" stroke-width="5" stroke-linecap="round"/>
        <text x="0" y="8" fill="#c9bfb2" font-size="12" text-anchor="middle">стимуляция</text>
      </g>
    </g>

    <line x1="24" y1="556" x2="296" y2="556" stroke="#272220"/>
    <text x="24" y="580" fill="#8a8178" font-size="12">Пресеты · второй уровень</text>
    <text x="296" y="580" fill="#6f665d" font-size="12" text-anchor="end">⌄</text>
  </g>

  <!-- ВЫНОСКИ -->
  <g fill="#8a8178" font-size="12">
    <line x1="240" y1="140" x2="112" y2="140" stroke="#3a342e"/>
    <text x="230" y="136" text-anchor="end">цвет интерфейса</text><text x="230" y="152" text-anchor="end">= цвет звука</text>
    <line x1="240" y1="292" x2="112" y2="292" stroke="#3a342e"/>
    <text x="230" y="288" text-anchor="end">зерно поверх поля:</text><text x="230" y="304" text-anchor="end">материал виден глазом</text>
    <line x1="240" y1="452" x2="112" y2="452" stroke="#3a342e"/>
    <text x="230" y="440" text-anchor="end">шкала-дайл вместо палки,</text><text x="230" y="456" text-anchor="end">риска как у приёмника;</text>
    <text x="230" y="472" text-anchor="end">∞ — отдельная кнопка,</text><text x="230" y="488" text-anchor="end">это режим, а не длина</text>
    <line x1="240" y1="610" x2="112" y2="610" stroke="#3a342e"/>
    <text x="230" y="606" text-anchor="end">три ручки языком домена:</text><text x="230" y="622" text-anchor="end">маскировка и стимуляция</text>

    <line x1="1060" y1="212" x2="928" y2="212" stroke="#3a342e"/>
    <text x="1070" y="208">звезда ближе —</text><text x="1070" y="224">рейс идёт</text>
    <line x1="1060" y1="452" x2="928" y2="452" stroke="#3a342e"/>
    <text x="1070" y="448">кнопка на том же месте,</text><text x="1070" y="464">меняется только слово</text>
    <line x1="1060" y1="656" x2="928" y2="656" stroke="#3a342e"/>
    <text x="1070" y="652">первый экран без ручек-</text><text x="1070" y="668">игрушек: внимание дорого</text>
  </g>
</svg>
