<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  .b{width:1280px;height:800px;position:relative;overflow:hidden;
     background:#0d0a06 url('panel-shot.png') center/cover no-repeat;
     font-family:'SF Pro Display',system-ui,-apple-system,sans-serif}
  .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,6,3,.55) 0%,rgba(8,6,3,0) 34%)}
  .txt{position:absolute;top:70px;left:0;right:0;text-align:center}
  .title{color:#FFF6E6;font-size:60px;font-weight:700;letter-spacing:-1px}
  .sub{color:#FFC978;font-size:27px;font-weight:500;margin-top:14px;letter-spacing:.2px}
</style></head><body>
<div class="b">
  <div class="veil"></div>
  <div class="txt">
    <div class="title">Minimalist Timer</div>
    <div class="sub">Focus, made of warm sound</div>
  </div>
</div>
</body></html>
