<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus timer — panel</title>
  <!--
    ПАНЕЛЬ = СТЕНД (26.09, слово автора: «нужно именно так, как сделано там»).
    Вид взят из lab/stend-vid-ot-zvuka-2026-09-26.html один в один: стили и разметка скопированы,
    а не пересказаны. Отличия только там, где стенд — картинка 360×660, а панель — окно любого размера:
      · поле (.panel) занимает всё окно; композиция стенда живёт в двух обёртках 360×660
        (.zad — то, что под стеклом, .pered — органы управления) и стоит по центру высоты;
      · на окне ниже 660 px композиция ужимается целиком (--k), а не обрезается.
    Пульт стенда (калибровка, гамма, «палка») сюда не едет — это наш прибор, а не продукт.
    Закон: визуальных настроек нет, вид — функция звука (dizajn/ZHURNAL.md).
  -->
  <style>
    :root{
      --warm:#ffb055; --warm-soft:#ffd9a0; --field:#0d0c0b; --edge:#272220;
      --ink:#e8ded2; --ink-dim:#8a8178; --ink-mute:#6f665d;
      --oreol:.5; --mercanie:1; --dyh:5.5s; --kal-zerno:1; --kal-oreol:1;
      --k:1; --y0:max(0px, calc(50vh - 330px));
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--field);color:var(--ink);font:14px/1.5 Inter,Helvetica,Arial,sans-serif;overflow:hidden}

    .panel{position:fixed;inset:0;border-radius:9px;background:var(--field);
           border:1px solid #1e1a18;overflow:hidden;user-select:none;-webkit-user-select:none;
           box-shadow:inset 0 0 90px rgba(255,176,85,calc(var(--oreol)*.10))}
    /* две обёртки = рамка стенда 360×660; все координаты внутри — ровно стендовые */
    .zad,.pered{position:absolute;left:0;right:0;margin:0 auto;max-width:360px;top:var(--y0);height:660px;
                pointer-events:none;transform:scale(var(--k));transform-origin:50% 0}
    .pered{z-index:4}
    .pered > *{pointer-events:auto}
    canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    canvas{opacity:0;transition:opacity .5s}                       /* в покое зерна нет: рябь утомляет */
    body.idet canvas.krupa{opacity:var(--kal-zerno);mix-blend-mode:overlay}
    body.idet canvas.stena{opacity:calc(var(--kal-zerno)*.9);mix-blend-mode:soft-light}
    body.idet canvas.iskry{opacity:1;mix-blend-mode:screen}
    svg.ramka{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.5}
    .bloom{position:absolute;left:50%;top:210px;width:520px;height:520px;transform:translate(-50%,-50%);
           pointer-events:none;border-radius:50%;
           background:radial-gradient(circle, color-mix(in srgb, var(--warm) 34%, transparent) 0%, transparent 62%);
           opacity:calc(var(--oreol)*var(--kal-oreol));filter:blur(22px);transition:opacity .4s}
    .vinetka{position:absolute;inset:0;pointer-events:none;
             background:radial-gradient(70% 62% at 50% calc(var(--y0) + 224px), transparent 52%, rgba(0,0,0,.66) 100%)}
    .steklo{position:absolute;inset:0;pointer-events:none;
            background:linear-gradient(180deg, rgba(255,255,255,.035) 0%, transparent 22%, transparent 78%, rgba(0,0,0,.25) 100%)}
    .star{position:absolute;left:calc(50% + 3px);top:208px;transform:translate(-50%,-50%);border-radius:50%;
          background:radial-gradient(circle, var(--warm-soft) 0 11%,
                     color-mix(in srgb, var(--warm) 62%, transparent) 32%, transparent 70%);
          transition:width .6s cubic-bezier(.2,.7,.2,1), height .6s cubic-bezier(.2,.7,.2,1), opacity .6s;
          animation:nakal var(--dyh) ease-in-out infinite}
    @keyframes nakal{0%,100%{filter:brightness(calc(1 - .07*var(--mercanie)))}
                     43%{filter:brightness(calc(1 + .09*var(--mercanie)))}
                     68%{filter:brightness(calc(1 - .04*var(--mercanie)))}}
    .zvezdy{position:absolute;inset:0;pointer-events:none}
    .zvezdy i{position:absolute;width:2px;height:2px;border-radius:50%;background:#efe3d2}
    .num{position:absolute;left:0;right:0;top:298px;text-align:center;font-size:31px;font-weight:500;letter-spacing:.5px;
         font-family:Georgia,"Times New Roman",serif}
    .pered > .num{pointer-events:none}
    .num small{display:block;font-size:11px;font-weight:400;color:var(--ink-mute);letter-spacing:0}
    .dial{position:absolute;left:0;right:0;top:250px;height:150px;cursor:ew-resize;transform:rotate(-.25deg)}
    .dial:focus{outline:none}
    body.inf-on .dial{display:none}
    body.inf-on .num{top:322px}
    .row{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:14px}
    .start{top:424px}
    .start button{background:var(--warm);color:#241a10;border:0;border-radius:6px;padding:11px 26px;
                  font-size:15px;font-weight:600;cursor:pointer;
                  box-shadow:0 0 26px color-mix(in srgb, var(--warm) calc(38% * var(--oreol)), transparent)}
    body.idet .start button{background:transparent;color:var(--ink);border:1px solid #5a4c3c;box-shadow:none}
    .start button.inf{width:46px;height:46px;border-radius:6px;border:1px solid #4a423b;background:#15110f;
         color:var(--ink-dim);font-size:27px;line-height:1;cursor:pointer;display:flex;
         align-items:center;justify-content:center;padding:0 0 3px;font-family:Georgia,"Times New Roman",serif}
    .start button.inf.on{border-color:var(--warm);color:var(--warm);background:#0a0807;
            box-shadow:inset 0 3px 7px rgba(0,0,0,.75), inset 0 -1px 0 rgba(255,255,255,.04);
            transform:translateY(1px)}
    .start button.inf.on{border-color:var(--warm);color:var(--warm)}
    .colors{position:absolute;right:22px;top:22px;display:flex;gap:12px;z-index:4}
    .colors b{width:19px;height:19px;border-radius:50%;cursor:pointer;display:block}
    .colors b.on{box-shadow:0 0 0 2px var(--field),0 0 0 4px var(--warm)}
    .colors b:focus{outline:none}
    .knobs{position:absolute;left:0;right:0;top:534px;display:flex;justify-content:space-around}
    .knob{width:74px;text-align:center;cursor:ns-resize;position:relative}
    .knob:focus{outline:none}
    .knob span{position:absolute;left:-12px;right:-12px;top:50px;color:#c9bfb2;font-size:11px;opacity:0;transition:opacity .18s}
    .knob em{position:absolute;left:-16px;right:-16px;top:66px;color:var(--ink-mute);font-size:10px;font-style:normal;opacity:0;transition:opacity .18s}
    .knob:hover span,.knob:hover em{opacity:1}
    .presets{position:absolute;left:24px;right:24px;top:480px;display:flex;justify-content:center;z-index:5}
    .dropbtn{background:#141110;color:var(--ink-dim);border:1px solid #2e2825;border-radius:4px;
             padding:7px 30px 7px 14px;font:12px/1 inherit;cursor:pointer;position:relative;min-width:150px}
    .dropbtn::after{content:'';position:absolute;right:13px;top:11px;width:5px;height:5px;
                    border-right:1px solid #6f665d;border-bottom:1px solid #6f665d;transform:rotate(45deg)}
    .dropbtn:hover{color:var(--ink);border-color:#43392f}
    .droplist{position:absolute;bottom:34px;margin:0;padding:4px;list-style:none;min-width:150px;
              background:#100d0c;border:1px solid #2e2825;border-radius:4px;box-shadow:0 8px 22px rgba(0,0,0,.6)}
    .droplist li{padding:6px 10px;font-size:12px;color:var(--ink-dim);cursor:pointer;border-radius:3px}
    .droplist li:hover{background:#1c1714;color:var(--ink)}
    .droplist li.on{color:var(--warm)}
    @media (prefers-reduced-motion: reduce){ .star{animation:none} }

    /* ── Ниже — то, чего на стенде нет, потому что стенд не живёт у людей: просьба об оценке.
       ПЛАШКА — тихая дверь в правом нижнем углу (реш. автора 08-10), только в покое, уступает карточке. */
    .ratebar{position:fixed;right:16px;bottom:10px;z-index:6;
      display:flex;align-items:center;gap:7px;font-size:10.5px;color:#6b5f50;opacity:.62;transition:opacity .3s}
    .ratebar:hover{opacity:1}
    .ratebar[hidden]{display:none}
    .ratebar .rlab{color:#7d6647}
    .rstar{width:15px;height:15px;cursor:pointer;color:#46351f;transition:color .2s, transform .2s}
    .rstar:hover{transform:scale(1.15)}
    .rstar.lit{color:var(--warm)}
    /* КАРТОЧКА поверх звезды — по прибытии, с 3-го рейса (паттерн ExportGPT). Вуаль ловит клик по
       звезде (взлететь до ответа нельзя), органы управления остаются в руках — они выше вуали. */
    #askveil{position:fixed;inset:0;z-index:3;cursor:default}
    .askcard{position:fixed;left:50%;top:calc(var(--y0) + 208px * var(--k));transform:translate(-50%,-50%);z-index:6;
      display:flex;flex-direction:column;align-items:center;gap:10px;width:214px;
      padding:15px 16px 11px;border-radius:9px;text-align:center;
      background:rgba(16,13,12,.9);border:1px solid #2e2825;
      box-shadow:0 10px 30px rgba(0,0,0,.5);animation:askin .5s ease both}
    @keyframes askin{from{opacity:0;transform:translate(-50%,-44%)}to{opacity:1;transform:translate(-50%,-50%)}}
    @media (prefers-reduced-motion: reduce){ .askcard{animation:none} }
    .askcard .alab{font-size:12.5px;color:var(--ink)}
    .askcard .astars{display:flex;gap:5px}
    .askcard .rstar{width:25px;height:25px;color:#4a3826}
    .askcard .later{font-size:11px;color:var(--ink-mute);cursor:pointer;padding:3px 8px;transition:color .25s}
    .askcard .later:hover{color:var(--ink-dim)}

    /* УГОЛ СЛЕВА — два тихих переключателя (26.09), зеркало плашки оценки справа.
       motion — выключатель движения: зерно замирает, звезда перестаёт дышать. Единственное исключение
       из закона «визуальных настроек нет» — это про удобство, а не про вкус (DECISIONS 26.09).
       edge tab — язычок у края страниц, дверь обратно в рейс (жил в Settings старой панели). */
    .ugol{position:fixed;left:16px;bottom:10px;z-index:6;display:flex;align-items:center;gap:14px;
          font-size:10.5px;color:#6b5f50;opacity:.62;transition:opacity .3s}
    .ugol:hover{opacity:1}
    .ugol label{display:flex;align-items:center;gap:6px;cursor:pointer}
    .ugol label[hidden]{display:none}
    .swt{position:relative;width:22px;height:12px;border-radius:6px;background:#15110f;border:1px solid #2e2825;
         flex:none;transition:border-color .25s}
    .swt::after{content:'';position:absolute;top:2px;left:2px;width:6px;height:6px;border-radius:50%;
                background:#4a423b;transition:left .2s, background .2s}
    .swt.on{border-color:#4a423b}
    .swt.on::after{left:12px;background:var(--warm)}
    .swt:focus{outline:none}
    .swt:focus-visible{outline:1px solid var(--warm);outline-offset:2px}
    body.tiho .star{animation:none}

    /* ПОЛКА — не в прод-UI (премиум-эксперименты + дев); код жив, глаз юзера не видит */
    .shelf{display:none}
  </style>
</head>
<body>
<div class="panel" id="panel">
  <canvas class="krupa" id="krupa"></canvas>
  <canvas class="stena" id="stena"></canvas>
  <canvas class="iskry" id="iskry"></canvas>
  <div class="zvezdy" id="zvezdy"></div>
  <div class="zad">
    <div class="bloom"></div>
    <div class="star" id="star" style="width:190px;height:190px;cursor:pointer;pointer-events:auto"></div>
  </div>
  <div class="vinetka"></div>
  <div class="steklo"></div>
  <svg class="ramka" id="ramka" viewBox="0 0 360 660" preserveAspectRatio="none"></svg>

  <div class="colors" id="colors" role="radiogroup" aria-label="noise colour">
    <b class="on" data-c="brown" data-w="#ffb055" data-s="#ffd9a0" style="background:#c98a4b" role="radio" aria-checked="true" tabindex="0" title="brown noise — the deepest and warmest"></b>
    <b data-c="pink" data-w="#e8a0b4" data-s="#ffd8e2" style="background:#b98a95" role="radio" aria-checked="false" tabindex="-1" title="pink noise — a step brighter"></b>
    <b data-c="white" data-w="#dfe4ea" data-s="#ffffff" style="background:#d9d6d0" role="radio" aria-checked="false" tabindex="-1" title="white noise — the brightest"></b>
  </div>

  <div class="pered">
    <div class="num" id="num">15′<small id="podpis"></small></div>

    <svg class="dial" id="dial" viewBox="0 0 360 150" role="slider" aria-label="session length"
         aria-valuemin="5" aria-valuemax="90" aria-valuenow="15" tabindex="0">
      <path d="M 68 120 A 112 112 0 0 1 292 120" fill="none" stroke="#2b2724" stroke-width="7" stroke-linecap="round"/>
      <path id="prizrak" d="" fill="none" stroke="var(--warm)" stroke-width="7" stroke-linecap="round" opacity=".16" transform="translate(.8,.6)"/>
      <path id="duga" d="" fill="none" stroke="var(--warm)" stroke-width="7" stroke-linecap="round" opacity=".92"/>
      <g id="riski" stroke="#4a423b" stroke-width="2"></g>
      <g id="podpisi" fill="#6f665d" font-size="10.5" font-family="Georgia, serif" text-anchor="middle"></g>
      <!-- просвет в стрелке под цифрами: стрелка на 25′ шла прямо сквозь отсчёт «18′ 39″» (находка дорожки картинок 26.09) -->
      <defs><mask id="bezCifr" maskUnits="userSpaceOnUse" x="0" y="0" width="360" height="150">
        <rect width="360" height="150" fill="#fff"/><rect id="dyra" x="0" y="0" width="0" height="0" rx="4" fill="#000"/>
      </mask></defs>
      <line id="strelka" x1="180" y1="120" x2="180" y2="30" stroke="var(--warm-soft)" stroke-width="2.5" stroke-linecap="round" mask="url(#bezCifr)"/>
      <circle cx="180" cy="120" r="4" fill="var(--warm-soft)"/>
    </svg>

    <div class="row start">
      <button id="start">▶&nbsp; Start</button>
      <button class="inf" id="inf" aria-pressed="false" aria-label="no end" title="no end — the sound just runs">∞</button>
    </div>

    <div class="knobs" id="knobs">
      <div class="knob" role="slider" aria-label="volume" aria-valuemin="0" aria-valuemax="100"><svg viewBox="0 0 96 60"><path d="M 20 46 A 28 28 0 1 1 76 46" fill="none" stroke="#2b2724" stroke-width="5" stroke-linecap="round"/><path class="fill" d="" fill="none" stroke="var(--warm)" stroke-width="5" stroke-linecap="round"/></svg><span>volume</span><em>keep it low</em></div>
      <div class="knob" role="slider" aria-label="masking" aria-valuemin="0" aria-valuemax="100"><svg viewBox="0 0 96 60"><path d="M 20 46 A 28 28 0 1 1 76 46" fill="none" stroke="#2b2724" stroke-width="5" stroke-linecap="round"/><path class="fill" d="" fill="none" stroke="var(--warm)" stroke-width="5" stroke-linecap="round"/></svg><span>masking</span><em>cover voices</em></div>
      <div class="knob" role="slider" aria-label="stimulation" aria-valuemin="0" aria-valuemax="100"><svg viewBox="0 0 96 60"><path d="M 20 46 A 28 28 0 1 1 76 46" fill="none" stroke="#2b2724" stroke-width="5" stroke-linecap="round"/><path class="fill" d="" fill="none" stroke="var(--warm)" stroke-width="5" stroke-linecap="round"/></svg><span>stimulation</span><em>how much noise</em></div>
      <div class="knob" role="slider" aria-label="tone" aria-valuemin="0" aria-valuemax="100"><svg viewBox="0 0 96 60"><path d="M 20 46 A 28 28 0 1 1 76 46" fill="none" stroke="#2b2724" stroke-width="5" stroke-linecap="round"/><path class="fill" d="" fill="none" stroke="var(--warm)" stroke-width="5" stroke-linecap="round"/></svg><span>tone</span><em>noise ⟷ tone</em></div>
    </div>

    <div class="presets">
      <button class="dropbtn" id="dropbtn">custom</button>
      <ul class="droplist" id="droplist" hidden>
        <li data-p="office">open office</li><li data-p="dorm">thin walls</li><li data-p="cafe">café</li>
        <li data-p="reading">deep reading</li><li data-p="thoughts">racing thoughts</li><li data-p="overload">too much</li>
      </ul>
    </div>
  </div>

  <div class="ugol">
    <label id="motionrow" title="moving grain and a breathing star — switch off if motion bothers you">
      <span>motion</span><span class="swt on" id="motion" role="switch" aria-checked="true" aria-label="motion" tabindex="0"></span>
    </label>
    <label id="glowrow" hidden title="a warm thread at the right edge of pages — a door back to your session">
      <span>edge tab</span><span class="swt" id="glowtoggle" role="switch" aria-checked="false" aria-label="edge tab" tabindex="0"></span>
    </label>
  </div>

  <div class="ratebar" id="ratebar" hidden title="a rating helps others find the flight">
    <span class="rlab">Rate us</span>
    <span id="rstars"></span>
  </div>
</div>

<div class="shelf" id="shelf">
  <label><input type="checkbox" id="fast"> fast (dev)</label>
  <label><input type="checkbox" id="premium"> premium layer</label>
  <label>harmony <input type="range" id="harmony" min="0" max="1" step="0.02" value="0.7"></label>
</div>

<script src="track.js?b=56"></script>
<script src="engine.js?b=56"></script>
<script src="tone.js?b=56"></script>
<script src="remote.js?b=56"></script>
<script src="hearth.js?b=56"></script>
</body>
</html>
