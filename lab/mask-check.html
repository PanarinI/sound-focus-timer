<!doctype html><meta charset="utf-8"><!-- ЗАПУСК: сервер sft-root (корень проекта) → /lab/mask-check.html -->
<title>проверка кокона</title>
<body style="background:#12100c;color:#c79a58;font:13px/1.6 ui-monospace,monospace;padding:20px">
<p style="color:#7d6a4a;margin:0 0 14px">Стенд движка. Запуск: Browser pane → сервер <b>sft-root</b> (корень проекта, порт 8785) → <code>/lab/mask-check.html</code>. Считает в OfflineAudioContext — ничего не звучит.</p>
<pre id="out">измеряю…</pre>
<script>window.__oc=null; window.AudioContext=function(){return window.__oc};</script>
<script src="../extension/engine.js"></script>
<script>
(async () => {
  const L = ['КОКОН = ШИРИНА. Цель: RMS почти ровный, яркость растёт сильно.', ''];
  for (const c of ['brown', 'pink', 'white']) {
    const row = [];
    for (const mask of [0, 0.45, 1]) {
      const oc = window.__oc = new OfflineAudioContext(1, 44100 * 8, 44100);
      const e = new AudioEngine(() => {});
      e.turnOn();                       // строит граф
      e.colour = c;
      e.cur.master = 0.5;               // пик фазы (тикер в offline не идёт — ставим руками)
      e.setChar({ masking: mask });     // ← настоящий путь ручки
      const d = (await oc.startRendering()).getChannelData(0);
      // меряем последнюю секунду: setTargetAtTime успевает дойти до цели
      const s = d.length - 44100;
      let rms = 0, zc = 0;
      for (let i = s + 1; i < d.length; i++) { rms += d[i] * d[i]; if ((d[i] >= 0) !== (d[i-1] >= 0)) zc++; }
      row.push({ mask, rms: Math.sqrt(rms / 44100), zc });
    }
    const db = 20 * Math.log10(row[2].rms / row[0].rms);
    L.push(`${c.padEnd(6)} ` + row.map(r => `кокон ${r.mask}: rms ${r.rms.toFixed(4)} ярк ${String(r.zc).padStart(5)}`).join(' | ')
      + `   →  уровень ${db >= 0 ? '+' : ''}${db.toFixed(1)} дБ · яркость ×${(row[2].zc / row[0].zc).toFixed(2)}`);
  }
  document.getElementById('out').textContent = L.join('\n');
})().catch(e => document.getElementById('out').textContent = 'ОШИБКА: ' + e.message + '\n' + e.stack);
</script>
