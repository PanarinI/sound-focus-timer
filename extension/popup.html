<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <div class="orb-box">
      <div id="orb" class="orb"></div>
      <div id="remaining" class="remaining"></div>
    </div>
    <div id="phaseLabel" class="phase-label">выключено</div>

    <button id="primary" class="primary">Включить</button>

    <div id="durations" class="durations hidden">
      <button class="chip" data-min="25">25</button>
      <button class="chip active" data-min="50">50</button>
      <button class="chip" data-min="90">90</button>
    </div>

    <button id="secondary" class="secondary hidden">Выключить</button>

    <details class="tune">
      <summary>настроить</summary>
      <label>спокойнее ↔ энергичнее <input type="range" id="energy" min="0" max="1" step="0.02" value="0.4"></label>
      <label>маскировка (тоньше ↔ толще) <input type="range" id="masking" min="0" max="1" step="0.02" value="0.45"></label>
      <label>громкость <input type="range" id="volume" min="0" max="1" step="0.02" value="0.5"></label>
    </details>
  </div>
  <script src="popup.js"></script>
</body>
</html>
