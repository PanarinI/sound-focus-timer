<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <div class="orb-box">
      <div id="orb" class="orb"></div>
      <div id="remaining" class="remaining"></div>
    </div>
    <div id="phaseLabel" class="phase-label">выключено</div>

    <button id="primary" class="primary">Включить</button>

    <div id="durations" class="durations hidden">
      <button class="chip" data-min="25">25</button>
      <button class="chip active" data-min="50">50</button>
      <button class="chip" data-min="90">90</button>
    </div>

    <button id="secondary" class="secondary hidden">Выключить</button>

    <details class="tune">
      <summary>настроить</summary>
      <label>тон ↔ шум <input type="range" id="balance" min="0" max="1" step="0.05" value="0.62"></label>
      <label>темнее ↔ светлее <input type="range" id="brightness" min="-0.3" max="0.3" step="0.02" value="0"></label>
      <label>тише ↔ громче <input type="range" id="volume" min="-0.4" max="0.4" step="0.02" value="0"></label>
    </details>
  </div>
  <script src="popup.js"></script>
</body>
</html>
